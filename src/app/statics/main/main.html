<section class="hero">
  <div class="hero-content">
    <h1 class="hero-title">About us</h1>
    <p class="hero-description">
      We provide you with the best client for a comfortable gaming that will give you the best gaming experience.
    </p>
    <div class="hero-actions">
      <button class="btn btn-auth"><i class="fa-solid fa-bag-shopping"></i> Authorization</button>
      <a href="https://t.me/greedvlog" target="_blank" rel="noopener noreferrer" class="btn btn-more">Read More <i class="fa-solid fa-arrow-right"></i></a>
    </div>
  </div>
  <div class="hero-image">
    <div class="carousel">
      <button class="carousel-btn carousel-btn-left" (click)="prev()">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <div class="carousel-track" [style.transform]="'translateX(-' + currentIndex() * 100 + '%)'">
        @for (slide of slides; track slide) {
          <img
            [src]="slide"
            alt="Slide {{ $index + 1 }}"
            class="carousel-slide"
            (click)="openLightbox($index)"
          >
        }
      </div>
      <button class="carousel-btn carousel-btn-right" (click)="next()">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>
    <div class="carousel-dots">
      @for (slide of slides; track slide; let i = $index) {
        <span class="dot" [class.active]="i === currentIndex()" (click)="currentIndex.set(i)"></span>
      }
    </div>
  </div>
</section>

@if (lightboxOpen()) {
  <div class="lightbox" (click)="closeLightbox()">
    <button class="lightbox-close" (click)="closeLightbox()">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <button class="lightbox-btn lightbox-btn-left" (click)="lightboxPrev($event)">
      <i class="fa-solid fa-chevron-left"></i>
    </button>
    <img [src]="slides[lightboxIndex()]" alt="Full" class="lightbox-image">
    <button class="lightbox-btn lightbox-btn-right" (click)="lightboxNext($event)">
      <i class="fa-solid fa-chevron-right"></i>
    </button>
    <div class="lightbox-counter">{{ lightboxIndex() + 1 }} / {{ slides.length }}</div>
  </div>
}
